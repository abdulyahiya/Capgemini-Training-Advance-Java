spring.application.name=ApiGateWay
server.port=8085
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
spring.cloud.discovery.enabled=true

spring.cloud.gateway.server.webflux.routes[0].id=book-store
spring.cloud.gateway.server.webflux.routes[0].uri=lb://BookStoreInventoryManagement
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/books/**

spring.cloud.gateway.server.webflux.routes[1].id=student
spring.cloud.gateway.server.webflux.routes[1].uri=lb://springRest
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/students/**





